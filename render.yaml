services:
  - type: web
    name: promo-master-v2
    runtime: node
    buildCommand: cd apps/web && npm install --include=dev && npm run build
    startCommand: cd apps/web && npm start
    envVars:
      - key: VITE_API_URL
        value: https://promo-master-api.onrender.com
      - key: NODE_ENV
        value: production
