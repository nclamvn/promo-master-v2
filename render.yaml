services:
  - type: web
    name: promo-master-v2
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_API_URL
        value: https://promo-master-api.onrender.com
      - key: NODE_ENV
        value: production
